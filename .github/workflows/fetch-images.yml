# ينزّل صور ويكيبيديا ويحفظها جوه اللعبة (حتى تشتغل بدون إنترنت).
# يشتغل وحده لما تتغير الأسئلة (content.js) أو السكربت، أو يدوياً من تبويب Actions.
name: Fetch Wikipedia images

on:
  push:
    paths:
      - 'js/data/content.js'
      - 'tools/fetch-wiki-images.mjs'
      - '.github/workflows/fetch-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download images
        run: node tools/fetch-wiki-images.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wiki js/data/wiki-images.js credits.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update offline Wikipedia images"
            git push
          fi
