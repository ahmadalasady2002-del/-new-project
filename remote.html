<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>شوتايم — الحكم</title>
  <meta name="theme-color" content="#0a0e1c">
  <link rel="stylesheet" href="css/fonts.css?v=202610112139">
  <link rel="stylesheet" href="css/style.css?v=202610112139">
</head>
<body class="remote">
  <main class="r-wrap">
    <header class="r-head">
      <h1>أنت الحكم</h1>
      <span class="pill" id="r-status">جاري الاتصال…</span>
    </header>

    <section class="r-card" id="r-answer-card">
      <span class="muted small" id="r-label">الجواب الحالي</span>
      <div class="r-answer" id="r-answer">—</div>
      <span class="muted small" id="r-cat"></span>
    </section>

    <div class="r-actions">
      <button class="r-btn ok" id="r-correct">صحيح</button>
      <button class="r-btn warn" id="r-skip">ما يعرفها — مرّرها ↪️</button>
      <button class="r-btn spin" id="r-spin">دوّر العجلة</button>
      <button class="r-btn spin" id="r-next">الجولة الجاية</button>
    </div>

    <div class="r-box" id="r-speed-ready">
      <div class="r-alert" id="r-speed-alert">⚡ تعادل! جولة حاسمة</div>
      <button class="r-btn gold" id="r-speed-start">⚡ ابدأ الجولة الحاسمة</button>
    </div>
    <div class="r-box" id="r-speed">
      <span class="r-sub">منو جاوب أول؟ دوس على الفريق:</span>
      <div id="r-speed-teams" class="r-box" style="display:flex"></div>
      <button class="r-btn warn" id="r-speed-skip" style="display:block">محد عرفها — سؤال ثاني</button>
    </div>
    <div class="r-box" id="r-punish"></div>

    <div class="r-teams" id="r-teams"></div>

    <button class="r-btn ghost" id="r-pause">إيقاف مؤقت</button>
    <button class="r-btn mute" id="r-mute">🔊 صوت التلفزيون</button>
    <button class="r-btn danger" id="r-cancel">إلغاء اللعبة والرجوع للبداية</button>
    <p class="muted small center" id="r-hint"></p>
  </main>

  <script src="vendor/peerjs.min.js?v=202610112139"></script>
  <script src="js/common.js?v=202610112139"></script>
  <script src="js/remote.js?v=202610112139"></script>
</body>
</html>
